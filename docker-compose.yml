services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: merchant_realms
      POSTGRES_PASSWORD: merchant_realms
      POSTGRES_DB: merchant_realms_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U merchant_realms -d merchant_realms_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
